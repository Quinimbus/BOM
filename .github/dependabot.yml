version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
    groups:
      junit:
        patterns:
          - org.junit.jupiter*
      jackson:
        patterns:
          - com.fasterxml.jackson*
    ignore:
      - dependency-name: "com.fasterxml.jackson:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily